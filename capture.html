<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>QuickNote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #333;
      --text: #e8e8e8;
      --text2: #888;
      --accent: #4a9eff;
      --accent2: #2d7ad6;
      --tag-bg: #1e3a5f;
      --tag-text: #7ab8ff;
      --danger: #ff4a4a;
      --success: #4aff8b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s;
    }

    .header-btn:hover, .header-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Capture Area */
    .capture-area {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .capture-input {
      width: 100%;
      min-height: 80px;
      max-height: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      padding: 12px 16px;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .capture-input:focus {
      border-color: var(--accent);
    }

    .capture-input::placeholder {
      color: var(--text2);
    }

    .capture-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .tag-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .tag-input-wrap label {
      color: var(--text2);
      font-size: 13px;
    }

    .tag-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--tag-text);
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      width: 160px;
      font-family: inherit;
    }

    .tag-input::placeholder { color: var(--text2); }

    .save-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-left: 10px;
    }

    .save-btn:hover { background: var(--accent2); }
    .save-btn:active { transform: scale(0.96); }
    .save-btn:disabled { opacity: 0.4; cursor: default; }

    /* Search */
    .search-bar {
      padding: 12px 16px;
      display: none;
    }

    .search-bar.show { display: block; }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      font-family: inherit;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text2); }

    /* Notes List */
    .notes-container {
      padding: 8px 16px 100px;
    }

    .day-group {
      margin-bottom: 24px;
    }

    .day-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 0;
      position: sticky;
      top: 61px;
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-count {
      font-weight: 400;
      color: var(--text2);
      font-size: 12px;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      transition: all 0.15s;
      position: relative;
    }

    .note-card:active {
      background: var(--surface2);
    }

    .note-text {
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .note-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tag:hover { opacity: 0.8; }

    .note-time {
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
      margin-left: 8px;
    }

    .note-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .note-card:hover .note-delete { opacity: 1; }

    .note-delete:hover { color: var(--danger); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 15px;
      line-height: 1.6;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 1000;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Filter tags bar */
    .filter-bar {
      padding: 8px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .filter-tag:hover, .filter-tag.active {
      background: var(--tag-bg);
      color: var(--tag-text);
      border-color: var(--tag-text);
    }

    /* Responsive */
    @media (min-width: 600px) {
      .capture-area, .search-bar, .notes-container, .filter-bar {
        max-width: 640px;
        margin-left: auto;
        margin-right: auto;
      }
      .header {
        padding: 12px calc((100% - 640px) / 2 + 16px);
      }
    }

    /* Keyboard shortcut hint */
    .shortcut-hint {
      font-size: 11px;
      color: var(--text2);
      margin-top: 6px;
      text-align: right;
    }

    @media (pointer: coarse) {
      .shortcut-hint { display: none; }
      .note-delete { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>QuickNote</h1>
    <div class="header-actions">
      <button class="header-btn" id="searchToggle" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="header-btn" id="exportBtn" title="Export Today">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>

  <div class="capture-area">
    <textarea class="capture-input" id="noteInput" placeholder="무엇이든 적어두세요..." autofocus></textarea>
    <div class="capture-actions">
      <div class="tag-input-wrap">
        <label>#</label>
        <input type="text" class="tag-input" id="tagInput" placeholder="태그 (쉼표로 구분)">
      </div>
      <button class="save-btn" id="saveBtn">저장</button>
    </div>
    <div class="shortcut-hint">Ctrl+Enter로 저장</div>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" class="search-input" id="searchInput" placeholder="메모 검색...">
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div class="notes-container" id="notesContainer"></div>

  <div class="toast" id="toast"></div>

  <script>
    // ==================== IndexedDB Layer ====================
    const DB_NAME = 'quicknote';
    const DB_VERSION = 1;
    const STORE_NAME = 'notes';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('date', 'date', { unique: false });
            store.createIndex('tags', 'tags', { unique: false, multiEntry: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function addNote(note) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).add(note);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteNote(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getAllNotes() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // ==================== Auto Tagging ====================
    const TAG_RULES = [
      { keywords: ['할일', '해야', 'todo', 'TODO', '하기', '해놓', '잊지말'], tag: '할일' },
      { keywords: ['아이디어', '생각', '떠오른', '영감', 'idea'], tag: '아이디어' },
      { keywords: ['회의', '미팅', 'meeting', '논의', '협의'], tag: '회의' },
      { keywords: ['읽기', '읽을', '책', 'book', '아티클', '기사', '블로그'], tag: '읽기' },
      { keywords: ['사기', '구매', '주문', '장보기', '쇼핑', '사야'], tag: '쇼핑' },
      { keywords: ['링크', 'http', 'www', '.com', '.kr', 'url'], tag: '링크' },
      { keywords: ['일정', '약속', '날짜', '시간', '몇시', '오전', '오후', '내일', '모레', '다음주'], tag: '일정' },
      { keywords: ['코드', 'code', 'bug', '버그', '에러', 'error', 'function', 'const ', 'let '], tag: '개발' },
      { keywords: ['요리', '레시피', '맛집', '음식', '메뉴'], tag: '음식' },
      { keywords: ['운동', '헬스', '러닝', '산책', '걷기', '스트레칭'], tag: '운동' },
    ];

    function autoTag(text) {
      const lower = text.toLowerCase();
      const tags = [];
      for (const rule of TAG_RULES) {
        if (rule.keywords.some(k => lower.includes(k.toLowerCase()))) {
          tags.push(rule.tag);
        }
      }
      return tags;
    }

    // ==================== UI Logic ====================
    const noteInput = document.getElementById('noteInput');
    const tagInput = document.getElementById('tagInput');
    const saveBtn = document.getElementById('saveBtn');
    const searchToggle = document.getElementById('searchToggle');
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('searchInput');
    const filterBar = document.getElementById('filterBar');
    const notesContainer = document.getElementById('notesContainer');
    const exportBtn = document.getElementById('exportBtn');
    const toast = document.getElementById('toast');

    let activeFilter = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const toDateStr = (dt) => dt.toISOString().split('T')[0];

      if (toDateStr(d) === toDateStr(today)) return '오늘';
      if (toDateStr(d) === toDateStr(yesterday)) return '어제';

      const month = d.getMonth() + 1;
      const day = d.getDate();
      const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
      return `${month}월 ${day}일 (${weekdays[d.getDay()]})`;
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      const period = h < 12 ? '오전' : '오후';
      const hour = h % 12 || 12;
      return `${period} ${hour}:${m}`;
    }

    function groupByDate(notes) {
      const groups = {};
      for (const note of notes) {
        const date = note.date;
        if (!groups[date]) groups[date] = [];
        groups[date].push(note);
      }
      // Sort dates descending
      const sorted = Object.keys(groups).sort((a, b) => b.localeCompare(a));
      return sorted.map(date => ({ date, notes: groups[date].sort((a, b) => b.timestamp - a.timestamp) }));
    }

    function getAllTags(notes) {
      const tagSet = new Set();
      for (const note of notes) {
        if (note.tags) note.tags.forEach(t => tagSet.add(t));
      }
      return [...tagSet].sort();
    }

    function renderFilterBar(notes) {
      const tags = getAllTags(notes);
      if (tags.length === 0) {
        filterBar.innerHTML = '';
        return;
      }
      filterBar.innerHTML = tags.map(tag =>
        `<button class="filter-tag ${activeFilter === tag ? 'active' : ''}" data-tag="${tag}">#${tag}</button>`
      ).join('');

      filterBar.querySelectorAll('.filter-tag').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.dataset.tag;
          activeFilter = activeFilter === tag ? null : tag;
          render();
        });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function highlightText(text, query) {
      if (!query) return escapeHtml(text);
      const escaped = escapeHtml(text);
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return escaped.replace(regex, '<mark style="background:var(--tag-bg);color:var(--tag-text);border-radius:2px;padding:0 2px">$1</mark>');
    }

    async function render() {
      let notes = await getAllNotes();
      const query = searchInput.value.trim().toLowerCase();

      // Filter by search
      if (query) {
        notes = notes.filter(n =>
          n.text.toLowerCase().includes(query) ||
          (n.tags && n.tags.some(t => t.toLowerCase().includes(query)))
        );
      }

      // Filter by tag
      if (activeFilter) {
        notes = notes.filter(n => n.tags && n.tags.includes(activeFilter));
      }

      renderFilterBar(await getAllNotes()); // Always show all tags

      if (notes.length === 0) {
        notesContainer.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#9998;</div>
            <p>${query || activeFilter ? '검색 결과가 없습니다' : '아직 메모가 없습니다.<br>위에서 바로 적어보세요!'}</p>
          </div>`;
        return;
      }

      const groups = groupByDate(notes);
      notesContainer.innerHTML = groups.map(g => `
        <div class="day-group">
          <div class="day-header">
            <span>${formatDate(g.date)}</span>
            <span class="day-count">${g.notes.length}개</span>
          </div>
          ${g.notes.map(n => `
            <div class="note-card" data-id="${n.id}">
              <button class="note-delete" title="삭제">&times;</button>
              <div class="note-text">${highlightText(n.text, query)}</div>
              <div class="note-meta">
                <div class="note-tags">
                  ${(n.tags || []).map(t => `<span class="tag" data-tag="${t}">#${t}</span>`).join('')}
                </div>
                <span class="note-time">${formatTime(n.timestamp)}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');

      // Delete handlers
      notesContainer.querySelectorAll('.note-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const card = btn.closest('.note-card');
          const id = card.dataset.id;
          if (confirm('이 메모를 삭제할까요?')) {
            await deleteNote(id);
            showToast('삭제됨');
            render();
          }
        });
      });

      // Tag click handlers
      notesContainer.querySelectorAll('.tag').forEach(tagEl => {
        tagEl.addEventListener('click', () => {
          activeFilter = activeFilter === tagEl.dataset.tag ? null : tagEl.dataset.tag;
          render();
        });
      });
    }

    // Save note
    async function saveNote() {
      const text = noteInput.value.trim();
      if (!text) return;

      const now = new Date();
      const manualTags = tagInput.value.split(',').map(t => t.trim()).filter(Boolean);
      const autoTags = autoTag(text);
      const allTags = [...new Set([...manualTags, ...autoTags])];

      const note = {
        id: now.getTime().toString(36) + Math.random().toString(36).slice(2, 6),
        text,
        tags: allTags,
        date: now.toISOString().split('T')[0],
        timestamp: now.getTime(),
      };

      await addNote(note);
      noteInput.value = '';
      tagInput.value = '';
      noteInput.style.height = 'auto';
      showToast('저장됨');
      render();
      noteInput.focus();
    }

    saveBtn.addEventListener('click', saveNote);

    // Ctrl+Enter to save
    noteInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        saveNote();
      }
    });

    // Auto-resize textarea
    noteInput.addEventListener('input', () => {
      noteInput.style.height = 'auto';
      noteInput.style.height = Math.min(noteInput.scrollHeight, 200) + 'px';
    });

    // Search toggle
    searchToggle.addEventListener('click', () => {
      searchBar.classList.toggle('show');
      searchToggle.classList.toggle('active');
      if (searchBar.classList.contains('show')) {
        searchInput.focus();
      } else {
        searchInput.value = '';
        render();
      }
    });

    searchInput.addEventListener('input', () => {
      render();
    });

    // Export today's notes as text
    exportBtn.addEventListener('click', async () => {
      const notes = await getAllNotes();
      const today = new Date().toISOString().split('T')[0];
      const todayNotes = notes.filter(n => n.date === today).sort((a, b) => a.timestamp - b.timestamp);

      if (todayNotes.length === 0) {
        showToast('오늘 메모가 없습니다');
        return;
      }

      let md = `# ${today} 메모\n\n`;
      for (const n of todayNotes) {
        const time = formatTime(n.timestamp);
        const tags = n.tags.length ? ` [${n.tags.map(t => '#' + t).join(' ')}]` : '';
        md += `- **${time}**${tags}\n  ${n.text.replace(/\n/g, '\n  ')}\n\n`;
      }

      // Copy to clipboard
      try {
        await navigator.clipboard.writeText(md);
        showToast('오늘 메모가 클립보드에 복사됨');
      } catch {
        // Fallback: download as file
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `notes-${today}.md`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('파일로 다운로드됨');
      }
    });

    // Initial render
    render();

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
